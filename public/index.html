// CSV Parser for file uploads
function parseCSV(text){
  var lines=text.replace(/\r/g,"").split("\n").filter(function(l){return l.trim()});
  if(lines.length<2)return[];
  var headers=parseLine(lines[0]);
  return lines.slice(1).map(function(line){
    var vals=parseLine(line);var obj={};
    headers.forEach(function(h,i){obj[h.trim()]=(vals[i]||"").trim()});
    return obj;
  }).filter(function(r){return Object.values(r).some(function(v){return v})});
}
function parseLine(line){
  var result=[],current="",inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"')inQ=!inQ;
    else if(c===","&&!inQ){result.push(current);current=""}
    else current+=c;
  }
  result.push(current);return result;
}
